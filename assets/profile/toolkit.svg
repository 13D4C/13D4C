<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="758" viewBox="0 0 1200 758" role="img" aria-labelledby="title desc">
<title id="title">Skills and tools</title><desc id="desc">Languages, web development, cloud, infrastructure as code, databases, networking, observability, AI, hardware, design, and collaboration. The complete technology list is available in the expandable text version below.</desc>
