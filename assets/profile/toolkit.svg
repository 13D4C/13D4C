 <text x="56" y="55" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="400" fill="#68dce8" letter-spacing="2">03 / SKILLS &amp; TOOLS</text><text x="56" y="107" font-family="Georgia, DejaVu Serif, serif" font-size="44" font-weight="400" fill="#f4fbff" >A toolkit without borders.</text><rect x="56" y="146" width="532" height="176" rx="16" fill="#0d2836" stroke="#254c60"/><text x="80" y="181" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#68dce8" letter-spacing="2">01</text><text x="128" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#f4fbff" >Code &amp; web</text><text x="80" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#b0c8d3" >Go · Python · TypeScript · JavaScript</text><text x="80" y="255" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#b0c8d3" >Java · C++ · C# · Bash</text><text x="80" y="285" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#b0c8d3" >Svelte · Next.js · Tailwind CSS</text><rect x="612" y="146" width="532" height="176" rx="16" fill="#0d2836" stroke="#254c60"/><text x="636" y="181" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#68dce8" letter-spacing="2">02</text><text x="684" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#f4fbff" >Cloud &amp; delivery</text><text x="636" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#b0c8d3" >AWS · GCP · Azure · Huawei Cloud</text><text x="636" y="255" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#b0c8d3" >Cloudflare · Docker · Podman</text><text x="636" y="285" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#b0c8d3" >Terraform · OpenTofu · Ansible</text><rect x="56" y="342" width="532" height="176"